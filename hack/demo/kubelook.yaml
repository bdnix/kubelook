# Kubelook's configuration in the local demo (docker-compose.yaml). Never use it for a real deployment: sign-in goes
# to a stand-in that approves everyone, and the encryption key is published in docker-compose.yaml.
server:
  publicURL: "http://localhost:8080"
database:
  driver: postgres
  migrateOnStart: true
auth:
  restrictSignIn: true
  # GitHub only: Kubelook keys users by provider, so "alice via GitHub" and "alice via Google" would be two users with
  # separate saved credentials, which only confuses a demo.
  github:
    clientId: kubelook-it
    allowedOrgs: [demo]
    baseURL: "http://kubelook-signin:8300/github"
    apiBaseURL: "http://kubelook-signin:8300/github/api"
vault:
  address: "http://vault:8200"
  candidateRoles: [devops-role, viewer-role]
maintenance:
  banner: "Local demo: sign-in is a stand-in that lets anyone in. Never expose this setup beyond localhost."
