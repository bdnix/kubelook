name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# Required checks (branch protection): backend-tests, frontend-tests, ui-tests, integration-tests, image-scan,
# chart-tests, chart-install-tests. Publishing happens only on pushes to main, after all of them have passed.
jobs:
  # Lint, unit tests and the vulnerability check of one side share a job: one checkout, one
  # toolchain setup, one cache. The coverage run IS the unit-test run, so no test runs twice.
  backend-tests:
    name: "Backend: Lint, Unit Tests & Coverage"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Unit tests with coverage (>= 90%)
        run: make coverage-backend 2>&1 | tee go-coverage.txt
      - name: Release script tests (VERSION form)
        run: make test-release-scripts
      - name: Vulnerability check (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Report coverage
        if: ${{ !cancelled() }}
        run: hack/coverage-summary.sh backend >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

  frontend-tests:
    name: "Frontend: Lint, Unit Tests & Coverage"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Lint and type check
        run: make lint-frontend
      - name: Unit tests with coverage (>= 90%)
        run: make coverage-frontend 2>&1 | tee web-coverage.txt
      - name: Dependency audit (npm audit)
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - name: Report coverage
        if: ${{ !cancelled() }}
        run: hack/coverage-summary.sh frontend >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: |
            web/coverage/lcov.info
            web/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

  # The built web app in real Chromium, with the API answered by the tests (web/ui).
  # The full-stack browser tests (real backend, Vault, clusters) are Step 7.10.
  ui-tests:
    name: UI Tests (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Cache browser
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Install browser system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: web
      - name: Build application and run UI tests
        run: make test-ui
      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The real Kubelook image against real Vault and two real Kubernetes clusters (kind), with the
  # identity stand-in. No mocks of Vault or Kubernetes (PLAN.md Phase 7). The browser suite and
  # PostgreSQL arrive in Steps 7.9-7.10. No secrets and no write permissions: safe on fork pull requests.
  integration-tests:
    name: "Integration & End-to-End Tests (kind, Vault, PostgreSQL)"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            test/e2e/package-lock.json
      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('hack/install-tools.sh') }}
      - name: Start the environment (kind, Vault, PostgreSQL, identity stand-in, Kubelook)
        run: make it-up
      - name: Integration tests
        run: make it
      - name: Install the browser of the end-to-end tests
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: test/e2e
      - name: Browser end-to-end tests
        run: make e2e
      - name: Collect logs
        if: ${{ failure() }}
        run: |
          mkdir -p it-logs
          for c in $(docker ps -a --format '{{.Names}}' | grep kubelook-it); do docker logs "$c" > "it-logs/$c.log" 2>&1 || true; done
          bin/kind export logs it-logs/kind-alpha --name kubelook-it-alpha || true
          bin/kind export logs it-logs/kind-beta --name kubelook-it-beta || true
          echo "--- last lines of the Kubelook container log (without audit records and request lines)"
          grep -v '"audit":true' it-logs/kubelook-it-app.log | grep -v '"msg":"request"' | tail -60 || true
          echo "--- requests of the container that answered 401"
          grep '"msg":"request"' it-logs/kubelook-it-app.log | grep '"status":401' | tail -20 || true
      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs
          path: |
            it-logs
            test/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove the environment
        if: ${{ always() }}
        run: make it-down

  # Lints and renders the Helm chart with every ci values file and asserts on the manifests; no cluster needed.
  # The install in a real cluster is the job chart-install-tests (Step 8.3).
  chart-tests:
    name: "Helm Chart: Lint & Template Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install the tools (helm, kubectl)
        run: make tools
      - name: Lint, render and assert
        run: make chart-test
      - name: Put helm on the path for chart-testing
        run: echo "$PWD/bin" >> "$GITHUB_PATH"
      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      - name: Lint with chart-testing
        run: ct lint --config ct.yaml

  # The chart installed into a real kind cluster: the console it deploys signs in, opens a Vault cluster, lists pods,
  # streams logs, upgrades and uninstalls. Needs the image and the environment of integration-tests, so it builds
  # its own: no secrets and no write permissions.
  chart-install-tests:
    name: "Helm Chart: Install Tests (kind)"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('hack/install-tools.sh') }}
      - name: Start the environment (kind, Vault, PostgreSQL, identity stand-in)
        run: make it-up
      - name: Install the chart
        run: hack/it-chart.sh
      - name: Chart install tests
        run: go test -tags integration -count=1 -run 'TestSmoke|TestChart' ./test/integration/...
        env:
          KUBELOOK_IT_BASE_URL: http://localhost:18090
      - name: Collect logs
        if: ${{ failure() }}
        run: |
          mkdir -p it-logs
          bin/kubectl --kubeconfig .it/kubeconfig-alpha-host.yaml -n kubelook get all,pvc,configmap -o wide > it-logs/kubelook-objects.txt 2>&1 || true
          bin/kubectl --kubeconfig .it/kubeconfig-alpha-host.yaml -n kubelook logs deployment/kubelook --tail=300 > it-logs/kubelook.log 2>&1 || true
          bin/kubectl --kubeconfig .it/kubeconfig-alpha-host.yaml -n kubelook describe pods > it-logs/kubelook-describe.txt 2>&1 || true
          cp .it/pf.log it-logs/ 2>/dev/null || true
          for c in $(docker ps -a --format '{{.Names}}' | grep kubelook-it); do docker logs "$c" > "it-logs/$c.log" 2>&1 || true; done
      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-install-logs
          path: it-logs
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove the environment
        if: ${{ always() }}
        run: make it-down

  # Builds the whole product (web app, Go binary, image), so there is no separate build job.
  image-scan:
    name: "Container Image: Build & Vulnerability Scan"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: kubelook:scan
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (Trivy; fails on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: kubelook:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test
        run: docker run --rm kubelook:scan version

  dependency-review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review added and changed dependencies
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  # Publishes only from pushes to main. A build is a release build when v<VERSION> is not a tag yet: the release
  # is created by the last job, which creates the tag on the tested commit (docs/releasing.md).
  publish-image:
    name: Publish Container Image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [backend-tests, frontend-tests, ui-tests, integration-tests, image-scan, chart-tests, chart-install-tests]
    runs-on: ubuntu-24.04
    environment: production   # restricted to the main branch in the repository settings (docs/ci.md)
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version and release detection
        id: version
        run: |
          version="$(hack/version.sh)"
          prerelease="$(hack/version.sh --prerelease)"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then release=false; else release=true; fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "release=$release"
            echo "build_version=$([ "$release" = true ] && echo "$version" || echo "$version-main.${GITHUB_SHA::7}")"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/bdnix/kubelook
          tags: |
            type=raw,value=main
            type=sha,format=long
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.release == 'true' && steps.version.outputs.prerelease == 'false' }}
      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.build_version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/bdnix/kubelook
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image (keyless)
        run: cosign sign --yes "ghcr.io/bdnix/kubelook@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - name: Scan the published image (Trivy; release builds fail on fixable HIGH or CRITICAL)
        if: ${{ steps.version.outputs.release == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/bdnix/kubelook@${{ steps.push.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # The chart as an OCI artifact, with the digest of the image that was just built.
  publish-chart:
    name: Publish Helm Chart
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [publish-image]
    runs-on: ubuntu-24.04
    environment: production   # restricted to the main branch in the repository settings (docs/ci.md)
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.publish-image.outputs.version }}
      RELEASE: ${{ needs.publish-image.outputs.release }}
      PRERELEASE: ${{ needs.publish-image.outputs.prerelease }}
      DIGEST: ${{ needs.publish-image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install helm
        run: make tools
      - name: Package the chart
        run: |
          export PATH="$PWD/bin:$PATH"
          if [ "$RELEASE" = true ]; then chart_version="$VERSION"; else chart_version="$VERSION-main.${GITHUB_SHA::7}"; fi
          rm -rf "$RUNNER_TEMP/chart" && mkdir -p "$RUNNER_TEMP/chart" "$RUNNER_TEMP/out"
          cp -R deploy/helm/kubelook "$RUNNER_TEMP/chart/kubelook"
          sed -i -E "s#^(  digest: )\"\"\$#\1\"$DIGEST\"#" "$RUNNER_TEMP/chart/kubelook/values.yaml"
          grep -q "digest: \"$DIGEST\"" "$RUNNER_TEMP/chart/kubelook/values.yaml"
          if [ "$PRERELEASE" = true ]; then
            { printf 'Release candidate: the test against a real organisation'"'"'s Vault is still open.\n\n'; cat "$RUNNER_TEMP/chart/kubelook/README.md"; } > "$RUNNER_TEMP/readme"
            mv "$RUNNER_TEMP/readme" "$RUNNER_TEMP/chart/kubelook/README.md"
          fi
          helm package "$RUNNER_TEMP/chart/kubelook" --version "$chart_version" --app-version "$chart_version" --destination "$RUNNER_TEMP/out"
          echo "CHART_FILE=$RUNNER_TEMP/out/kubelook-$chart_version.tgz" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | bin/helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the chart
        run: bin/helm push "$CHART_FILE" oci://ghcr.io/bdnix/charts
      - name: Keep the chart archive for the release
        if: ${{ env.RELEASE == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: ${{ env.CHART_FILE }}
          if-no-files-found: error
          retention-days: 7

  # Creates the tag v<VERSION> on the tested commit and the GitHub release. No job pushes a tag by itself.
  create-release:
    name: Create Release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish-image.outputs.release == 'true' }}
    needs: [publish-image, publish-chart]
    runs-on: ubuntu-24.04
    environment: production   # restricted to the main branch in the repository settings (docs/ci.md)
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
      - name: Create the release
        run: |
          flags=(--target "$GITHUB_SHA" --generate-notes --title "v$VERSION")
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease --notes "Release candidate: the test against a real organisation's Vault is still open.")
          fi
          gh release create "v$VERSION" "${flags[@]}" --repo "$GITHUB_REPOSITORY" kubelook-*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish-image.outputs.version }}
          PRERELEASE: ${{ needs.publish-image.outputs.prerelease }}
