name: ci

# The pipeline (docs/ci.md): fast checks and the image build run in parallel; the real-system tests run against the
# image the build made; on main, after every check passed, release-please updates the release pull request or cuts
# the release, and the publishing jobs push the very images that were tested, sign and attest them, and verify what
# they published. Nothing is published from pull requests or the merge queue.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # The workflows themselves: actionlint for correctness, zizmor for security (template injection, permissions,
  # unpinned actions and the like).
  workflow-lint:
    name: "Workflows: Lint & Security Audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}   # for the audits that look actions up on GitHub
        run: pipx run zizmor==1.33.1 --no-progress --config .github/zizmor.yml .github/workflows .github/actions

  backend-tests:
    name: "Backend: Lint, Unit Tests & Coverage"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Unit tests with coverage (>= 90%)
        run: make coverage-backend 2>&1 | tee go-coverage.txt
      - name: Vulnerability check (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Report coverage
        if: ${{ !cancelled() }}
        run: hack/coverage-summary.sh backend >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

  frontend-tests:
    name: "Frontend: Lint, Unit Tests & Coverage"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "true"
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Lint and type check
        run: make lint-frontend
      - name: Unit tests with coverage (>= 90%)
        run: make coverage-frontend 2>&1 | tee web-coverage.txt
      - name: Dependency audit (npm audit)
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - name: Report coverage
        if: ${{ !cancelled() }}
        run: hack/coverage-summary.sh frontend >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: |
            web/coverage/lcov.info
            web/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

  # The built web app in real Chromium, with the API answered by the tests (web/ui).
  # The full-stack browser tests (real backend, Vault, clusters) are Step 7.10.
  ui-tests:
    name: UI Tests (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "true"
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Cache browser
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Install browser system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: web
      - name: Build application and run UI tests
        run: make test-ui
      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The real Kubelook image against real Vault and two real Kubernetes clusters (kind), with the
  # identity stand-in. No mocks of Vault or Kubernetes (PLAN.md Phase 7). The browser suite and
  # PostgreSQL arrive in Steps 7.9-7.10. No secrets and no write permissions: safe on fork pull requests.

  chart-tests:
    name: "Helm Chart: Lint & Template Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: "true"
      - name: Lint, render and assert
        run: make chart-test
      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      - name: Lint with chart-testing (it calls helm, from bin/)
        run: PATH="$PWD/bin:$PATH" ct lint --config ct.yaml

  # The image is built once per architecture, on a native runner, and every later job uses that build: the
  # real-system tests load it, and on main the publishing job pushes it. Each architecture is smoke-tested and scanned
  # where it was built.
  build:
    name: "Image: Build, Smoke Test & Scan (${{ matrix.arch }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version of the build
        id: version
        run: echo "version=$(cat VERSION)-ci.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: kubelook:dev
          outputs: type=docker,dest=${{ runner.temp }}/kubelook-${{ matrix.arch }}.tar
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Smoke test (runs, as 65532:65532, without a shell)
        env:
          ARCHIVE: ${{ runner.temp }}/kubelook-${{ matrix.arch }}.tar
        run: |
          docker load -q -i "$ARCHIVE"
          docker run --rm kubelook:dev version
          test "$(docker inspect -f '{{.Config.User}}' kubelook:dev)" = "65532:65532"
          if docker run --rm --entrypoint /bin/sh kubelook:dev -c true 2>/dev/null; then echo "the image has a shell" >&2; exit 1; fi
      - name: Scan (Trivy; fails on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: kubelook:dev
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Keep the image for the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/kubelook-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 3

  # Real Vault, real PostgreSQL, real Kubernetes: Kubelook is installed from its Helm chart (two replicas) into a host
  # kind cluster and manages two more (Kubernetes 1.35 and 1.37). The Go suite, the browser suite and the chart's life
  # cycle (upgrade, uninstall) all run against that one release of the image the build job made.
  integration-tests:
    name: "Integration & End-to-End Tests (Helm-installed, kind, Vault, PostgreSQL)"
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: "true"
          node: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}
      - name: Cache the browser
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-e2e-${{ runner.os }}-${{ hashFiles('test/e2e/package-lock.json') }}
      - name: Install the browser of the end-to-end tests
        working-directory: test/e2e
        env:
          CACHED: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          npm ci
          if [ "$CACHED" = "true" ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi
      - name: Start the environment
        run: make it-up
        env:
          KUBELOOK_IMAGE_ARCHIVE: ${{ runner.temp }}/kubelook-amd64.tar
      - name: Browser end-to-end tests
        run: make e2e
      - name: Integration tests (the last one upgrades, uninstalls and reinstalls the release)
        run: make it
      - name: Collect logs
        if: ${{ failure() }}
        run: |
          mkdir -p it-logs
          K="bin/kubectl --kubeconfig .it/kubeconfig-host-host.yaml -n kubelook"
          $K get all,pvc,configmap,jobs -o wide > it-logs/kubelook-objects.txt 2>&1 || true
          $K describe pods > it-logs/kubelook-describe.txt 2>&1 || true
          $K logs -l app.kubernetes.io/instance=kubelook --tail=-1 --max-log-requests=10 --prefix > it-logs/kubelook.log 2>&1 || true
          for c in $(docker ps -a --format '{{.Names}}' | grep kubelook-it); do docker logs "$c" > "it-logs/$c.log" 2>&1 || true; done
          for c in alpha beta host; do bin/kind export logs "it-logs/kind-$c" --name "kubelook-it-$c" || true; done
          echo "--- last lines of the Kubelook log (without audit records and request lines)"
          grep -v '"audit":true' it-logs/kubelook.log | grep -v '"msg":"request"' | tail -60 || true
      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs
          path: |
            it-logs
            test/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove the environment
        if: ${{ always() }}
        run: make it-down

  dependency-review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review added and changed dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Publishes only from pushes to main. A build is a release build when v<VERSION> is not a tag yet: the release
  # is created by the last job, which creates the tag on the tested commit (docs/releasing.md).

  # On main, after every check passed: release-please keeps the release pull request up to date, and when that pull
  # request was merged it creates the tag and the GitHub release (docs/releasing.md). It runs here, after the checks,
  # so a release is never cut from a commit whose checks failed.
  release-please:
    name: Release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [workflow-lint, backend-tests, frontend-tests, ui-tests, chart-tests, build, integration-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production   # restricted to the main branch in the repository settings (docs/ci.md)
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A token other than GITHUB_TOKEN, so that the release pull request triggers the checks (docs/releasing.md).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Pushes the images the build job made and the tests used (never a rebuild), as one multi-architecture image; signs
  # it; attests provenance and the SBOM of each architecture; then verifies all of it from the registry.
  publish-image:
    name: Publish Container Image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [release-please]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production   # restricted to the main branch in the repository settings (docs/ci.md)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    env:
      IMAGE: ghcr.io/bdnix/kubelook
      RELEASE: ${{ needs.release-please.outputs.release_created }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push each architecture
        id: arch
        run: |
          for arch in amd64 arm64; do
            docker load -q -i "$RUNNER_TEMP/kubelook-$arch.tar"
            docker tag kubelook:dev "$IMAGE:sha-$GITHUB_SHA-$arch"
            docker push -q "$IMAGE:sha-$GITHUB_SHA-$arch"
            echo "$arch=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA-$arch" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"
          done
      - name: Create the multi-architecture image
        id: manifest
        env:
          AMD64: ${{ steps.arch.outputs.amd64 }}
          ARM64: ${{ steps.arch.outputs.arm64 }}
        run: |
          tags=(-t "$IMAGE:main" -t "$IMAGE:sha-$GITHUB_SHA")
          if [ "$RELEASE" = "true" ]; then
            tags+=(-t "$IMAGE:$VERSION")
            # The moving <major>.<minor> tag only for final versions, never for release candidates.
            [[ "$VERSION" == *-* ]] || tags+=(-t "$IMAGE:${VERSION%.*}")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign (keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/bdnix/kubelook
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: SBOM (amd64)
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ghcr.io/bdnix/kubelook@${{ steps.arch.outputs.amd64 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-amd64.spdx.json
          upload-artifact: false
      - name: SBOM (arm64)
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ghcr.io/bdnix/kubelook@${{ steps.arch.outputs.arm64 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-arm64.spdx.json
          upload-artifact: false
      - name: Attest the SBOM (amd64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/bdnix/kubelook
          subject-digest: ${{ steps.arch.outputs.amd64 }}
          sbom-path: ${{ runner.temp }}/sbom-amd64.spdx.json
          push-to-registry: true
      - name: Attest the SBOM (arm64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/bdnix/kubelook
          subject-digest: ${{ steps.arch.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/sbom-arm64.spdx.json
          push-to-registry: true
      - name: Verify what was published
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
          docker run --rm "$IMAGE@$DIGEST" version

  # The chart as an OCI artifact, pinned to the digest of the image just published; then pulled back and rendered.
  publish-chart:
    name: Publish Helm Chart
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [release-please, publish-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production   # restricted to the main branch in the repository settings (docs/ci.md)
    permissions:
      contents: write   # the chart archive is attached to the GitHub release
      packages: write
    env:
      RELEASE: ${{ needs.release-please.outputs.release_created }}
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      DIGEST: ${{ needs.publish-image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: "true"
      - name: Package the chart
        run: |
          if [ "$RELEASE" = "true" ]; then chart_version="$VERSION"; else chart_version="$(cat VERSION)-main.${GITHUB_SHA::7}"; fi
          rm -rf "$RUNNER_TEMP/chart" && mkdir -p "$RUNNER_TEMP/chart" "$RUNNER_TEMP/out"
          cp -R deploy/helm/kubelook "$RUNNER_TEMP/chart/kubelook"
          sed -i -E "s#^(  digest: )\"\"\$#\1\"$DIGEST\"#" "$RUNNER_TEMP/chart/kubelook/values.yaml"
          grep -q "digest: \"$DIGEST\"" "$RUNNER_TEMP/chart/kubelook/values.yaml"
          if [[ "$chart_version" == *-rc.* ]]; then
            { printf 'Release candidate: the test against a real organisation'"'"'s Vault is still open.\n\n'; cat "$RUNNER_TEMP/chart/kubelook/README.md"; } > "$RUNNER_TEMP/readme"
            mv "$RUNNER_TEMP/readme" "$RUNNER_TEMP/chart/kubelook/README.md"
          fi
          bin/helm package "$RUNNER_TEMP/chart/kubelook" --version "$chart_version" --app-version "$chart_version" --destination "$RUNNER_TEMP/out"
          { echo "CHART_FILE=$RUNNER_TEMP/out/kubelook-$chart_version.tgz"; echo "CHART_VERSION=$chart_version"; } >> "$GITHUB_ENV"
      - name: Push the chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | bin/helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          bin/helm push "$CHART_FILE" oci://ghcr.io/bdnix/charts
      - name: Verify the published chart (pull it back and render it)
        run: |
          bin/helm pull oci://ghcr.io/bdnix/charts/kubelook --version "$CHART_VERSION" --destination "$RUNNER_TEMP/pulled"
          bin/helm template kubelook "$RUNNER_TEMP/pulled/kubelook-$CHART_VERSION.tgz" -f deploy/helm/kubelook/ci/sqlite-values.yaml \
            | grep -q "image: \"ghcr.io/bdnix/kubelook@$DIGEST\""
      - name: Attach the chart to the release
        if: ${{ env.RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "$CHART_FILE" --repo "$GITHUB_REPOSITORY"
          if [[ "$VERSION" == *-rc.* ]]; then
            body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
              --notes "$(printf 'Release candidate: the test against a real organisation'"'"'s Vault is still open.\n\n%s' "$body")"
          fi
