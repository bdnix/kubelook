name: netshoot

# Publishes ghcr.io/bdnix/kubelook-netshoot, the default debug image of Kubelook (spec: debug toolkit). A new
# netshoot release reaches build/netshoot/Dockerfile as a Dependabot pull request on its FROM line; merging it
# runs this workflow, which publishes the new image.
on:
  push:
    branches: [main]
    paths: [build/netshoot/**]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish Debug Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the netshoot tag from the Dockerfile
        id: tag
        run: |
          TAG=$(sed -n 's/^FROM nicolaka\/netshoot:\([^@ ]*\).*/\1/p' build/netshoot/Dockerfile)
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build/netshoot
          load: true
          push: false
          tags: kubelook-netshoot:scan
      - name: Scan image (Trivy; report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: kubelook-netshoot:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Report only: this is a third-party toolbox image. Deployers may replace it with debug.image.
          exit-code: "0"
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build/netshoot
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/bdnix/kubelook-netshoot:${{ steps.tag.outputs.tag }}
          provenance: mode=max
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/bdnix/kubelook-netshoot
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
