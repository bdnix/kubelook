name: Integration and end-to-end tests
description: |
  Starts the integration environment (docs/development.md) against the image the build job made, runs the browser suite and
  the Go integration suite, and removes the environment. The caller checks out the repository first.
inputs:
  database:
    description: |
      sqlite: one replica on SQLite, what every pull request runs. postgres: two replicas on PostgreSQL, with the tests of
      what the replicas share (they carry the build tag itpostgres).
    required: true
  go-cache:
    description: Name of this job's Go cache (see the setup action).
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
      with:
        go-cache: ${{ inputs.go-cache }}
        tools: "true"
        node: "true"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: image-amd64
        path: ${{ runner.temp }}
    - name: Install the end-to-end test runner
      shell: bash
      working-directory: test/e2e
      run: npm ci
    - name: Start the environment
      shell: bash
      run: make it-up
      env:
        IT_DATABASE: ${{ inputs.database }}
        KUBELOOK_IMAGE_ARCHIVE: ${{ runner.temp }}/kubelook-amd64.tar
    - name: Browser end-to-end tests (in the runner's Google Chrome)
      shell: bash
      run: make e2e
      env:
        IT_DATABASE: ${{ inputs.database }}
        PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    - name: Integration tests (the last one upgrades and uninstalls the release)
      shell: bash
      run: make it
      env:
        IT_DATABASE: ${{ inputs.database }}
    - name: Collect logs
      if: ${{ failure() }}
      shell: bash
      run: |
        mkdir -p it-logs
        K="bin/kubectl --kubeconfig .it/kubeconfig-host-host.yaml -n kubelook"
        $K get all,pvc,configmap,jobs -o wide > it-logs/kubelook-objects.txt 2>&1 || true
        $K describe pods > it-logs/kubelook-describe.txt 2>&1 || true
        $K logs -l app.kubernetes.io/instance=kubelook --tail=-1 --max-log-requests=10 --prefix > it-logs/kubelook.log 2>&1 || true
        for c in $(docker ps -a --format '{{.Names}}' | grep kubelook-it); do docker logs "$c" > "it-logs/$c.log" 2>&1 || true; done
        for c in alpha beta host; do bin/kind export logs "it-logs/kind-$c" --name "kubelook-it-$c" || true; done
        echo "--- last lines of the Kubelook log (without audit records and request lines)"
        grep -v '"audit":true' it-logs/kubelook.log | grep -v '"msg":"request"' | tail -60 || true
    - name: Upload logs
      if: ${{ failure() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: integration-logs-${{ inputs.database }}
        path: |
          it-logs
          test/e2e/test-results
        if-no-files-found: ignore
        retention-days: 7
    - name: Remove the environment
      if: ${{ always() }}
      shell: bash
      run: make it-down
