apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  labels: {app: web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger
  namespace: demo
  labels: {app: logger}
spec:
  replicas: 1
  selector:
    matchLabels: {app: logger}
  template:
    metadata:
      labels: {app: logger}
    spec:
      containers:
        - name: logger
          image: busybox:1.37
          command:
            - sh
            - -c
            - 'i=0; while true; do echo "{\"level\":\"info\",\"msg\":\"tick\",\"n\":$i}"; i=$((i+1)); sleep 1; done'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shell
  namespace: demo
  labels: {app: shell}
spec:
  replicas: 1
  selector:
    matchLabels: {app: shell}
  template:
    metadata:
      labels: {app: shell}
    spec:
      containers:
        - name: shell
          image: busybox:1.37
          command: [sleep, "1000000"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
  namespace: demo
data:
  mode: integration
---
apiVersion: v1
kind: Secret
metadata:
  name: credentials
  namespace: demo
type: Opaque
stringData:
  password: s3cret-it-value
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 80
