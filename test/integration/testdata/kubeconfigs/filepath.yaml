apiVersion: v1
kind: Config
clusters:
  - name: demo
    cluster:
      server: https://kubelook-it-alpha-control-plane:6443
      insecure-skip-tls-verify: true
users:
  - name: file-user
    user:
      client-certificate: /tmp/x
      client-key: /tmp/y
contexts:
  - name: demo
    context: {cluster: demo, user: file-user}
current-context: demo
