apiVersion: v1
kind: Config
clusters:
- name: c
  cluster: {server: "https://api.example:6443", certificate-authority-data: Y2EtZGF0YQ==}
users:
- name: u
  user:
    auth-provider:
      name: oidc
      config:
        idp-issuer-url: https://issuer.example
        client-id: kubelook
        idp-certificate-authority: /etc/idp-ca.crt
contexts:
- name: ctx
  context: {cluster: c, user: u}
