apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubelook.fullname" . }}
  labels: {{- include "kubelook.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  selector: {{- include "kubelook.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
